<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生端 - 新西方留学服务智能管家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 登录 -->
<div class="login-wrap" id="login-view">
  <div class="login-card">
    <h1>🎓 学生端登录</h1>
    <div class="sub">新西方留学服务 · 留学生智能管家</div>
    <div class="form-row"><label>用户名</label><input id="lg-user" placeholder="student1"></div>
    <div class="form-row"><label>密码</label><input id="lg-pass" type="password" placeholder="123456"></div>
    <button class="btn btn-primary" id="lg-btn" style="width:100%">登 录</button>
    <div class="demo-accounts">
      <b>演示账号（点击填充）</b>
      <div class="row"><span>张三（新加坡国际班）</span><a data-fill="student1">student1 / 123456</a></div>
      <div class="row"><span>李四（新加坡国际班）</span><a data-fill="student2">student2 / 123456</a></div>
      <div class="row"><span>许同学（德国双元制班）</span><a data-fill="student3">student3 / 123456</a></div>
    </div>
    <p style="margin-top:14px;text-align:center"><a href="index.html">← 返回官网</a></p>
  </div>
</div>

<!-- 应用 -->
<div class="app-layout hidden" id="app-view">
  <aside class="sidebar">
    <div class="brand">新西方留学服务<small>留学生智能管家</small></div>
    <div class="menu" id="menu">
      <a data-page="home" class="active">🏠 <span>首页总览</span></a>
      <a data-page="chat">💬 <span>智能管家</span></a>
      <a data-page="leave">📝 <span>请假申请</span></a>
      <a data-page="score">📊 <span>我的成绩</span></a>
      <a data-page="feedback">🛠️ <span>售后反馈</span></a>
    </div>
    <div class="userbox">
      <div class="name" id="sb-name"></div>
      <div class="muted" id="sb-dept" style="color:#7d8db1"></div>
      <a id="logout">退出登录</a>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script src="js/common.js"></script>
<script src="js/student.js"></script>
</body>
</html>
