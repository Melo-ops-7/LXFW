        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix: {assistant: '', user: ''}
          window: {enabled: true, size: 6}
        model:
          completion_params: {temperature: 0}
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: '从用户输入（含对话历史中补充的信息）抽取留学咨询画像，仅输出一个JSON对象，禁止输出markdown代码块、解释或任何多余文字。字段：name(字符串或null)、age(整数或null)、education(当前学历：初中/高中/中职技校/专科/本科/硕士之一或null，注意区分当前学历与目标学历，「想拿本科」的本科是目标不是当前)、intent(升学/就业/移民之一或null)、language(德语/英语或null)、hands_on(动手能力强为true否则null)、budget(充足/有限或null)。无法确定的字段填null。'
        - role: user
          text: '{{#sys.query#}}'
        selected: false
        title: LLM画像抽取
        type: llm
        variables: []
        vision: {enabled: false}
      height: 98
      id: llm_extract
      position: {x: 680, y: 220}
      positionAbsolute: {x: 680, y: 220}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json
          import re

          def main(llm_text: str) -> dict:
              llm_profile = None
              try:
                  cleaned = re.sub(r"^```(?:json)?|```$", "", (llm_text or "").strip(), flags=re.M).strip()
                  parsed = json.loads(cleaned)
                  if isinstance(parsed, dict):
                      llm_profile = json.dumps(parsed, ensure_ascii=False)
              except Exception:
                  llm_profile = None
              return {"llm_profile": llm_profile}
        code_language: python3
        desc: 解析LLM画像JSON为字符串（失败时后端正则兜底）
        outputs:
          llm_profile: {children: null, type: string}
        selected: false
        title: 构造研判请求
        type: code
        variables:
        - value_selector: [llm_extract, text]
          variable: llm_text
      height: 54
