      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 新加坡2+2四年学费多少？
    - 德国双元制报名要求是什么？
    - 我家孩子19岁高中毕业，想快点拿本科学历
