    - data:
        context: {enabled: false, variable_selector: []}
        desc: 抽取报名要素
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix: {assistant: '', user: ''}
          window: {enabled: true, size: 6}
        model:
          completion_params: {temperature: 0}
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: '从用户输入（含对话历史）抽取活动报名要素，仅输出一个JSON对象，禁止markdown与解释。字段：event_name(活动名称关键词，如「留学分享会」「招生官见面会」，无法确定填null)、customer_name(姓名或null)、contact_info(手机号或null)。'
        - role: user
          text: '{{#sys.query#}}'
        selected: false
        title: 报名要素抽取
        type: llm
        variables: []
        vision: {enabled: false}
      height: 98
      id: llm_reg_extract
      position: {x: 680, y: 540}
      positionAbsolute: {x: 680, y: 540}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json
          import re

          def main(query: str, llm_text: str) -> dict:
              info = {}
              try:
                  cleaned = re.sub(r"^```(?:json)?|```$", "", (llm_text or "").strip(), flags=re.M).strip()
                  parsed = json.loads(cleaned)
                  if isinstance(parsed, dict):
                      info = parsed
              except Exception:
                  info = {}
              event_name = info.get("event_name") or query
              customer_name = info.get("customer_name")
              contact_info = info.get("contact_info")
              return {"event_name": event_name,
                      "customer_name": customer_name,
                      "contact_info": contact_info}
        code_language: python3
        desc: 抽取要素归一化（名称兜底为原话）
