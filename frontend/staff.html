<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>员工与后台 - 新西方留学服务</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 登录 -->
<div class="login-wrap" id="login-view">
  <div class="login-card">
    <h1>🏢 员工与后台登录</h1>
    <div class="sub">新西方留学服务 · 顾问 / 班主任 / 管理员</div>
    <div class="form-row"><label>用户名</label><input id="lg-user" placeholder="consultant1"></div>
    <div class="form-row"><label>密码</label><input id="lg-pass" type="password" placeholder="123456"></div>
    <button class="btn btn-primary" id="lg-btn" style="width:100%">登 录</button>
    <div class="demo-accounts">
      <b>演示账号（点击填充）</b>
      <div class="row"><span>顾问 · 陈顾问</span><a data-fill="consultant1">consultant1 / 123456</a></div>
      <div class="row"><span>班主任 · 王班主任</span><a data-fill="teacher1">teacher1 / 123456</a></div>
      <div class="row"><span>管理员</span><a data-fill="admin">admin / admin123</a></div>
    </div>
    <p style="margin-top:14px;text-align:center"><a href="index.html">← 返回官网</a></p>
  </div>
</div>

<!-- 应用 -->
<div class="app-layout hidden" id="app-view">
  <aside class="sidebar">
    <div class="brand">新西方留学服务<small id="sb-role">员工工作台</small></div>
    <div class="menu" id="menu"></div>
    <div class="userbox">
      <div class="name" id="sb-name"></div>
      <div class="muted" id="sb-dept" style="color:#7d8db1"></div>
      <a id="logout">退出登录</a>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script src="js/common.js"></script>
<script src="js/staff.js"></script>
</body>
</html>
