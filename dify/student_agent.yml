      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json
          import re

          def main(llm_text: str) -> dict:
              # 解析LLM风险评估JSON（清洗思维链与代码块），失败时后端正则兜底
              emotion_tag = None
              emotion_score = None
              try:
                  t = (llm_text or "")
                  if "</think>" in t:
                      t = t.split("</think>")[-1]
                  t = re.sub(r"^```(?:json)?|```$", "", t.strip(), flags=re.M).strip()
                  parsed = json.loads(t)
                  if isinstance(parsed, dict) and parsed.get("emotion_score") is not None:
                      emotion_tag = parsed.get("emotion_tag")
                      emotion_score = int(parsed["emotion_score"])
              except Exception:
                  pass
              return {"emotion_tag": emotion_tag, "emotion_score": emotion_score}
        code_language: python3
        desc: 解析LLM评估结果（后端显式/隐晦规则仍强制兜底）
        outputs:
          emotion_tag: {children: null, type: string}
          emotion_score: {children: null, type: number}
        selected: false
        title: 解析情绪评估
        type: code
        variables:
        - value_selector: [llm_risk, text]
          variable: llm_text
      height: 54
      id: code_emotion
      position: {x: 980, y: 620}
      positionAbsolute: {x: 980, y: 620}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
