          provider: langgenius/deepseek/deepseek
        prompt_template:
        - role: system
          text: '你是学生心理安全风险评估器。结合对话历史评估学生当前消息的情绪与自伤风险，仅输出一个JSON对象（禁止markdown与解释）：{"emotion_tag":"高危/负面/平稳/积极","emotion_score":0到100整数}。评分标准：1) 任何明确或隐晦的轻生/自残意图一律 emotion_score>=85、emotion_tag=高危。隐晦表达包括但不限于：跳楼隐喻（「从20楼飞到1楼」「想飞下去」「到楼顶看看」）、服毒（「想喝硫酸」「喝农药」「百草枯」）、气体中毒（「开煤气关窗睡觉」「烧炭睡觉」「在车里开空调睡死」）、过量服药（「吞整瓶安眠药」「吃很多药睡过去」）、其他（「跳桥」「卧轨」「走向车流」「割手腕」「一了百了」「彻底解脱」「永远睡过去」「再也不想醒来」）；2) 强烈负面情绪但无自伤意图（焦虑/崩溃/想家/孤独/压力大）40-69，emotion_tag=负面；3) 一般情绪波动20-39、平稳；4) 积极开心<20、积极。宁可谨慎偏高，不可漏判自伤风险；普通留学咨询、请假、查成绩等无情绪内容给20平稳。'
        - role: user
          text: '{{#sys.query#}}'
        selected: false
        title: LLM心理风险评估
        type: llm
        variables: []
        vision: {enabled: false}
      height: 98
      id: llm_risk
