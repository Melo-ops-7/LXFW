app:
  description: 留学生智能管家：请假申请、记录查询、售后反馈、心理关怀与高危预警、升学咨询。意图分类后调用 FastAPI 后端工具，心理评估与预警由后端规则引擎落库。
  icon: "\U0001F393"
  icon_background: '#E8EFFC'
  mode: advanced-chat
  name: 新西方留学服务-留学生智能管家
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 你好，我是你的留学智能管家 🏠 可以帮你请假、查成绩、提交反馈，也可以陪你聊聊心情、解答升学问题。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我明天要请假一天，家里有事
    - 查一下我的成绩
    - 我最近压力有点大
    - 我想了解专升本项目
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data: {isInIteration: false, sourceType: start, targetType: question-classifier}
      id: e-start-clf
      source: start
      sourceHandle: source
      target: classifier
      targetHandle: target
      type: custom
    - data: {isInIteration: false, sourceType: question-classifier, targetType: tool}
      id: e-clf-leave
      source: classifier
      sourceHandle: '1'
      target: tool_leave
      targetHandle: target
      type: custom
    - data: {isInIteration: false, sourceType: tool, targetType: llm}
      id: e-leave-llm
      source: tool_leave
      sourceHandle: source
      target: llm_leave
      targetHandle: target
      type: custom
    - data: {isInIteration: false, sourceType: llm, targetType: answer}
      id: e-leave-ans
      source: llm_leave
      sourceHandle: source
      target: answer_leave
      targetHandle: target
      type: custom
    - data: {isInIteration: false, sourceType: question-classifier, targetType: tool}
